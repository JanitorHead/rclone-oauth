<h1>rclone personal backup client</h1>
<p>This is a private, single-user OAuth client. It lets
<a href="https://rclone.org/">rclone</a> copy an encrypted backup repository from a home
server to the owner's own Google Drive.</p>
<p>It is not a public service. It is not offered to other users and does not access anyone
else's data.</p>
<p><a href="privacy.html">Privacy policy</a></p>
